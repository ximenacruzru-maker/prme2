name: AgencyZoom Nudge Check

on:
  schedule:
    # Runs twice a day (9am and 4pm UTC). Adjust to taste — this is intentionally
    # less frequent than the pipeline refresh since it's just a heads-up, not
    # something that needs to be instant.
    - cron: "0 9,16 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  nudge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run nudge check
        env:
          AZ_USERNAME: ${{ secrets.AZ_USERNAME }}
          AZ_PASSWORD: ${{ secrets.AZ_PASSWORD }}
        run: python3 nudge_check.py nudge_state.json nudge_output.md

      - name: Post or update the nudge issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const hasUpdates = fs.readFileSync('has_updates.flag', 'utf8').trim();
            if (hasUpdates !== 'true') {
              console.log('No new activity — skipping issue post.');
              return;
            }
            const body = fs.readFileSync('nudge_output.md', 'utf8');
            const title = '🔔 New AgencyZoom activity';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'az-nudge',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['az-nudge'],
              });
            }

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nudge_state.json
          git diff --quiet --cached || git commit -m "Update nudge check state ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
