name: Refresh AgencyZoom Pipeline Data

on:
  schedule:
    # Runs every hour. Adjust the cron expression to taste (this is UTC time).
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Refresh pipeline data
        env:
          AZ_USERNAME: ${{ secrets.AZ_USERNAME }}
          AZ_PASSWORD: ${{ secrets.AZ_PASSWORD }}
        run: python3 refresh_pipeline.py index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Auto-refresh pipeline data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
